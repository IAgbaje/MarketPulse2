<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00567c" />
      <stop offset="100%" stop-color="#2a6f97" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#002133" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  
  <!-- Shopping Basket & Pulse Chart Motif -->
  <g filter="url(#shadow)" transform="translate(64, 70)">
    <!-- Basket Outline -->
    <path d="M 64 160 L 320 160 L 290 320 L 94 320 Z" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="16" stroke-linejoin="round" />
    <path d="M 128 160 L 192 64 M 256 160 L 192 64" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
    
    <!-- Pulse Line with Naira Sign Accent -->
    <path d="M 40 240 L 130 240 L 160 190 L 210 270 L 245 225 L 340 225" fill="none" stroke="#68d391" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Pulse glowing node -->
    <circle cx="210" cy="270" r="14" fill="#68d391" stroke="#ffffff" stroke-width="4" />
    <circle cx="245" cy="225" r="10" fill="#ffffff" />
  </g>
  
  <!-- Naira symbol badge in bottom corner -->
  <circle cx="390" cy="390" r="64" fill="#ffffff" />
  <text x="390" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="#00567c" text-anchor="middle">₦</text>
</svg>
